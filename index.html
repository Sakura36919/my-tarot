<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神秘の託宣 - ミュシャ・タロット全22枚</title>
    <style>
        /* 基本設定：ダークテーマと明朝体 */
        body {
            background-color: #0d0d0d;
            color: #e0c386;
            font-family: "Hiragino Mincho ProN", "MS P明朝", serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            line-height: 1.6;
        }

        .oracle-container {
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        /* 占い師の画像：楕円形レイアウト（レスポンシブ） */
        .teller-header {
            width: 95%;
            max-width: 500px;
            height: auto;
            aspect-ratio: 3 / 2;
            margin: 0 auto;
            object-fit: cover;
            clip-path: ellipse(50% 45% at 50% 50%);
            display: block;
            border-bottom: 1px solid #5d4037;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 3px;
            margin: 15px 0;
            color: #fffdf5;
        }

        /* メッセージ：大きめの明朝体 */
        .message-text {
            font-size: 1.2rem;
            color: #f4d03f;
            padding: 0 15px;
            margin: 15px 0;
            min-height: 4em;
        }

        /* カードスロット：スマホでも最適な比率 */
        .card-slot {
            width: 80%;
            max-width: 280px;
            aspect-ratio: 1 / 1.7;
            border: 1px solid #e0c386;
            margin: 10px auto;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(224, 195, 134, 0.2);
        }

        .tarot-card-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: cardReveal 1s ease-in-out;
        }

        @keyframes cardReveal {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ボタンのデザイン：スマホで押しやすいサイズ */
        .draw-btn {
            background: linear-gradient(#8b1113, #4a0000);
            color: #fff;
            border: 1px solid #e0c386;
            padding: 12px 0;
            width: 80%;
            max-width: 300px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 30px;
            margin: 15px 0;
            font-family: inherit;
            transition: 0.3s;
        }

        .draw-btn:hover {
            filter: brightness(1.2);
        }

        #card-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 10px;
        }

        /* スマホ用微調整 */
        @media (max-width: 480px) {
            h1 { font-size: 1.3rem; }
            .message-text { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="oracle-container">
        <img src="teller.png" alt="占い師" class="teller-header">
        
        <h1>神秘の託宣</h1>

        <p class="message-text" id="intro-text">
            「22枚の運命の断片が、あなたの進むべき道を照らすでしょう…」
        </p>

        <div class="card-slot" id="card-display">
            <p style="opacity: 0.4; font-size: 0.8rem;">Tap to Draw</p>
        </div>

        <button class="draw-btn" onclick="drawCard()">運命の糸を引く</button>

        <div id="result-area">
            <h3 id="card-name"></h3>
            <p class="message-text" id="result-text"></p>
        </div>
    </div>

    <script>
        // 全22枚のタロットデータ
        const tarotDeck = [
            { name: "0. 愚者 (The Fool)", image: "card_00.png", message: "新しい旅の始まりです。純粋な心で、未知の世界へ踏み出しましょう。" },
            { name: "I. 魔術師 (The Magician)", image: "card_01.png", message: "あなたには全ての準備が整っています。その才能を信じて形にしましょう。" },
            { name: "II. 女教皇 (The High Priestess)", image: "card_02.png", message: "直感に耳を澄ませて。今は静かに内なる声を聞く時です。" },
            { name: "III. 女帝 (The Empress)", image: "card_03.png", message: "豊かさと愛が満ちています。周囲の人々を慈しみ、育んでください。" },
            { name: "IV. 皇帝 (The Emperor)", image: "card_04.png", message: "計画を立て、責任感を持って物事を推し進める強さを持ってください。" },
            { name: "V. 法王 (The Hierophant)", image: "card_05.png", message: "伝統や秩序を大切にし、信頼できる人の導きを求めてみましょう。" },
            { name: "VI. 恋人たち (The Lovers)", image: "card_06.png", message: "重要な選択の時です。心の底から望む方、愛を感じる方を選んでください。" },
            { name: "VII. 戦車 (The Chariot)", image: "card_07.png", message: "強い意志で前進してください。困難を乗り越え、勝利を掴み取れます。" },
            { name: "VIII. 力 (Strength)", image: "card_08.png", message: "真の強さは、優しさと忍耐の中にあります。自分自身を信じましょう。" },
            { name: "IX. 隠者 (The Hermit)", image: "card_09.png", message: "内省の時です。独り静かに自分を見つめ直し、真実を求めてください。" },
            { name: "X. 運命の輪 (Wheel of Fortune)", image: "card_10.png", message: "転換点が訪れました。変化を受け入れることで、新たな道が開けます。" },
            { name: "XI. 正義 (Justice)", image: "card_11.png", message: "公平さとバランスが重要です。冷静に状況を判断し、決断してください。" },
            { name: "XII. 吊るされた男 (The Hanged Man)", image: "card_12.png", message: "視点を変える必要があります。今は一時停止し、学ぶべき時です。" },
            { name: "XIII. 死神 (Death)", image: "card_13.png", message: "終わりの時ですが、それは新しい始まりを意味します。古いものを手放しましょう。" },
            { name: "XIV. 節制 (Temperance)", image: "card_14.png", message: "調和とバランスが必要です。穏やかに、異なる要素を融合させましょう。" },
            { name: "XV. 悪魔 (The Devil)", image: "card_15.png", message: "誘惑や束縛に注意してください。自由を取り戻す時が来ています。" },
            { name: "XVI. 塔 (The Tower)", image: "card_16.png", message: "予期せぬ変化が訪れますが、それは真実を明らかにする過程です。" },
            { name: "XVII. 星 (The Star)", image: "card_17.png", message: "希望が満ちています。自分の可能性を信じ、未来へ進みましょう。" },
            { name: "XVIII. 月 (The Moon)", image: "card_18.png", message: "不安や迷いの中にも直感はあります。隠された真実を見極めてください。" },
            { name: "XIX. 太陽 (The Sun)", image: "card_19.png", message: "成功と祝福が訪れます。明るい未来を信じ、自分を表現しましょう。" },
            { name: "XX. 審判 (The Judgement)", image: "card_20.png", message: "目覚めの時です。過去を振り返り、新たな決心を持って進みましょう。" },
            { name: "XXI. 世界 (The World)", image: "card_21.png", message: "一つのサイクルが完成しました。大きな成就と新たな旅が始まります。" }
        ];

        function drawCard() {
            const randomIndex = Math.floor(Math.random() * tarotDeck.length);
            const card = tarotDeck[randomIndex];
            const cardDisplay = document.getElementById('card-display');

            // カード画像の表示
            cardDisplay.innerHTML = `<img src="${card.image}" class="tarot-card-img" alt="${card.name}">`;

            // テキストの更新
            document.getElementById('card-name').innerText = card.name;
            document.getElementById('result-text').innerText = "「" + card.message + "」";
            
            // 導入文を薄くする演出
            document.getElementById('intro-text').style.opacity = "0.5";
        }
    </script>
</body>
</html>
